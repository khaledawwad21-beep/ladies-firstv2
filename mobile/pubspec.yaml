name: ladies_first
description: Ladies First mobile storefront — Android test build.
publish_to: none
version: 0.1.6+7

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  file_selector: ^1.1.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.3
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon.png
    - assets/brand-mark.png
