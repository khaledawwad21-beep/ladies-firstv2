name: Production Regression

on:
  push:
    branches: [cleanup-production, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run regression suite
        env:
          JWT_SECRET: ci-regression-secret-12345678901234567890
        run: npm test


  live-render-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render to deploy this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://ladies-firstv2.onrender.com/api/health
        run: |
          for attempt in $(seq 1 30); do
            echo "Live deploy check $attempt/30"
            body="$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL" || true)"
            if [ -n "$body" ]; then
              echo "$body"
              live_sha="$(printf '%s' "$body" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("gitCommit") or "").strip())' 2>/dev/null || true)"
              ok="$(printf '%s' "$body" | python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("ok"))).lower())' 2>/dev/null || true)"
              if [ "$ok" = "true" ] && [ "$live_sha" = "$EXPECTED_SHA" ]; then
                echo "Render is live on expected commit $EXPECTED_SHA"
                exit 0
              fi
              echo "Render currently reports commit: ${live_sha:-unknown}"
            fi
            sleep 20
          done
          echo "Render did not expose the expected commit within the smoke-check window."
          exit 1

      - name: Verify live storefront and public APIs
        env:
          BASE_URL: https://ladies-firstv2.onrender.com
        run: |
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/" | grep -qi "Ladies First"
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/admin.html" | grep -qi "Ladies First"
          for endpoint in /api/products /api/settings /api/categories /api/brands; do
            body="$(curl --fail --silent --show-error --max-time 20 "$BASE_URL$endpoint")"
            printf '%s' "$body" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data, dict)'
          done
          echo "Live storefront, admin page and public APIs are responding correctly."
