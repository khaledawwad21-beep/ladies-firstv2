name: Marketing workspace verification
on:
  pull_request:
    paths: ['frontend/admin*', 'backend/**', '.github/workflows/marketing-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: backend
      - run: node scripts/marketing-mobile-smoke.cjs
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-mobile-preview
          path: |
            marketing-mobile.png
            offer-lab-mobile.png
          if-no-files-found: warn
