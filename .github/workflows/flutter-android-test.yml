name: Flutter Android APK (test)

on:
  push:
    branches:
      - feature/flutter-mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Confirm Flutter project is present
        run: test -f pubspec.yaml && test -d lib && test -d android

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Dart analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build installable Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ladies-first-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
