name: Flutter Android APK (test)

on:
  push:
    branches: [feature/flutter-mobile-app]
    paths: ['mobile/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate missing Android project files
        run: flutter create --org com.ladiesfirst --project-name ladies_first --platforms android --no-pub .
      - name: Ensure Android networking and app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          text=text.replace('android:label="ladies_first"', 'android:label="Ladies First"')
          permission='<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text=text.replace('<application', permission+'\n    <application', 1)
          p.write_text(text)
          PY
      - name: Fetch Flutter packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Test Flutter code
        run: flutter test
      - name: Build installable Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ladies-first-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
