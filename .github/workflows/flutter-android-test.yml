name: Flutter Android APK (test)

on:
  push:
    branches: [feature/flutter-mobile-app]
    paths: ['mobile/**', '.github/workflows/flutter-android-test.yml']
  pull_request:
    branches: [feature/flutter-mobile-app]
    paths: ['mobile/**', '.github/workflows/flutter-android-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate missing Android project files
        run: flutter create --org com.ladiesfirst --project-name ladies_first --platforms android --no-pub .
      - name: Ensure Android networking and app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          text=text.replace('android:label="ladies_first"', 'android:label="Ladies First"')
          permission='<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text=text.replace('<application', permission+'\n    <application', 1)
          microphone='<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if microphone not in text:
              text=text.replace('<application', microphone+'\n    <application', 1)
          p.write_text(text)
          PY
      - name: Generate official Ladies First launcher icons
        run: |
          python3 -m pip install --quiet cairosvg
          python3 scripts/generate_branding.py
      - name: Verify Android launcher resources are branded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from hashlib import sha256
          base = Path('android/app/src/main')
          manifest = ET.parse(base/'AndroidManifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          application = manifest.find('application')
          assert application is not None
          assert application.get(android + 'icon') == '@mipmap/ic_launcher'
          assert application.get(android + 'label') == 'Ladies First'
          icon = base/'res/mipmap-anydpi-v26/ic_launcher.xml'
          assert icon.exists(), 'Android 8+ adaptive launcher icon missing'
          root = ET.parse(icon).getroot()
          assert root.tag == 'adaptive-icon', root.tag
          assert root.find('foreground').get(android + 'drawable') == '@drawable/lf_launcher_foreground'
          assert (base/'res/drawable-nodpi/lf_launcher_foreground.png').read_bytes()[:8] == bytes.fromhex('89504e470d0a1a0a')
          for density in ('mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi'):
              icon_png = base/f'res/mipmap-{density}/ic_launcher.png'
              assert icon_png.read_bytes()[:8] == bytes.fromhex('89504e470d0a1a0a')
              print(density, sha256(icon_png.read_bytes()).hexdigest()[:16])
          print('Verified native and adaptive Ladies First launcher icon resources')
          PY
      - name: Configure optional native push notifications
        run: python3 scripts/configure_push.py

      - name: Fetch Flutter packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Test Flutter code
        run: flutter test
      - name: Build installable Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ladies-first-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-device-smoke:
    needs: android-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ladies-first-android-debug-apk
          path: apk
      - name: Enable KVM for the isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the APK on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: python3 mobile/scripts/android_smoke.py
      - name: Upload actual Android screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladies-first-android-device-evidence
          path: android-evidence/
          if-no-files-found: warn
          retention-days: 14
