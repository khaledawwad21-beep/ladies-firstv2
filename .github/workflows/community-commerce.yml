name: Community commerce acceptance
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'backend/**', '.github/workflows/community-commerce.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/community-mobile-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-mobile-desktop-evidence
          path: backend/community-evidence/
          if-no-files-found: warn
          retention-days: 14
