name: Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact live release and public APIs
        run: |
          export EXPECTED_SHA="$(git rev-parse HEAD)"
          node backend/scripts/live-smoke.js
        env:
          SMOKE_ATTEMPTS: '3'
          BASE_URL: https://ladies-firstv2.onrender.com
