name: Admin native file upload verification
on:
  pull_request:
    branches: [codex/admin-companion-app]
    paths: ['mobile/**', '.github/workflows/admin-file-upload.yml', '.github/workflows/flutter-android-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter create --org com.ladiesfirst --project-name ladies_first --platforms android --no-pub .
      - run: |
          python3 scripts/configure_android_flavors.py
          python3 -m pip install --quiet cairosvg
          python3 scripts/generate_branding.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<application', '<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><application',1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: dart format lib/file_upload.dart test/file_upload_test.dart
      - run: flutter analyze
      - run: flutter test --dart-define=APP_MODE=admin
      - run: flutter build apk --debug --flavor admin --target-platform android-arm64 --dart-define=APP_MODE=admin
      - uses: actions/upload-artifact@v4
        with:
          name: Ladies-First-Admin-Upload-Fix
          path: mobile/build/app/outputs/flutter-apk/app-admin-debug.apk
          if-no-files-found: error
      - name: Build isolated emulator fixture APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/debug/AndroidManifest.xml')
          p.write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:usesCleartextTraffic="true"/></manifest>')
          PY
          flutter build apk --debug --flavor admin --target-platform android-x64 --dart-define=APP_MODE=admin --dart-define=STORE_URL=http://127.0.0.1:8765/ --dart-define=ADMIN_URL=http://127.0.0.1:8765/
      - uses: actions/upload-artifact@v4
        with:
          name: admin-upload-isolated-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-admin-debug.apk
  android-picker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: admin-upload-isolated-test-apk
          path: apk
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: python3 mobile/scripts/android_upload_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-upload-device-evidence
          path: android-upload-evidence/
