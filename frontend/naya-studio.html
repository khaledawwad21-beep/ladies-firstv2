<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نايا Multi-View 3D — Ladies First</title><style>:root{--p:#63345e;--pink:#e98eae;--cream:#fbf4ec;--line:#eadce3;--green:#64845c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#443542;font-family:Arial,Tahoma,sans-serif}.top{background:var(--p);color:#fff;padding:16px}.topin,.wrap{max-width:820px;margin:auto}.topin{display:flex;gap:10px;align-items:center}.top b{font-size:20px;flex:1}.top a,.btn,button{border:0;border-radius:11px;padding:12px 15px;background:var(--p);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.top a{background:#fff;color:var(--p);padding:9px 12px}.wrap{padding:18px 14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 28px #63345e14;margin-bottom:14px}.note,.status{padding:13px;border-radius:12px;background:#fff8fb;border:1px solid var(--line);line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.slot{border:2px dashed #d9b8ca;border-radius:15px;padding:10px;background:#fff8fb;text-align:center}.slot label{display:block;font-weight:700;cursor:pointer}.slot input{display:none}.slot img{display:none;width:100%;height:260px;object-fit:contain;border-radius:10px;margin-top:8px;background:#f3edf0}.required{color:#a62655}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pink{background:var(--pink)}.green{background:var(--green)}button:disabled{opacity:.45}.bar{height:12px;background:#eee3e9;border-radius:999px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:var(--pink);transition:.3s}.result{display:none}.model{width:100%;height:520px;border:1px solid var(--line);border-radius:14px;background:#f7f1f4}.status{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:600px){.grid{grid-template-columns:1fr}.slot img{height:320px}.model{height:430px}}</style><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script></head><body><div class="top"><div class="topin"><b>🌸 استوديو نايا Multi-View</b><a href="admin.html">لوحة التحكم</a></div></div><div class="wrap"><div class="card"><h2>إنشاء نايا 3D من عدة زوايا</h2><div class="note">الأمام إلزامي. ارفعي الصور بالترتيب: أمام، يسار، خلف، يمين.</div><div class="grid"><div class="slot"><label>① أمام FRONT <span class="required">— إلزامي</span><input id="front" type="file" accept="image/png,image/jpeg"></label><img id="frontP"></div><div class="slot"><label>② يسار LEFT<input id="left" type="file" accept="image/png,image/jpeg"></label><img id="leftP"></div><div class="slot"><label>③ خلف BACK<input id="back" type="file" accept="image/png,image/jpeg"></label><img id="backP"></div><div class="slot"><label>④ يمين RIGHT<input id="right" type="file" accept="image/png,image/jpeg"></label><img id="rightP"></div></div><div class="actions"><button id="generate">✨ إنشاء نايا 3D Multi-View</button><button id="check" class="pink" disabled>تحديث الحالة</button></div><div class="bar"><i id="bar"></i></div><div id="status" class="status">جاري التحقق…</div></div><div id="result" class="card result"><h2>نتيجة نايا</h2><model-viewer id="viewer" class="model" camera-controls auto-rotate shadow-intensity="1"></model-viewer><div class="actions"><a id="glb" class="btn green" target="_blank" rel="noopener">فتح GLB</a></div></div></div><script>const $=id=>document.getElementById(id),files={front:null,left:null,back:null,right:null};let taskId=null,timer=null,adminReady=false;const token=()=>localStorage.getItem('lf_admin_token')||'';const headers=(x={})=>({...x,...(token()?{Authorization:'Bearer '+token()}:{})});const say=t=>$('status').textContent=t;function ready(v){adminReady=!!v;$('generate').disabled=!v}async function json(r){const t=await r.text();try{return t?JSON.parse(t):{}}catch{return{message:t||('HTTP '+r.status)}}}function detail(j,s){return [j?.message,j?.suggestion,j?.code,j?.traceId&&('Trace ID: '+j.traceId),s&&('HTTP: '+s)].filter(Boolean).join('\n')||'خطأ غير معروف'}async function verify(){try{if(!token())throw Error('لا توجد جلسة إدارة');const r=await fetch('/api/auth/me',{headers:headers(),cache:'no-store'}),j=await json(r);if(!r.ok||!j.user)throw Error(detail(j,r.status));ready(true);say('✅ جاهز. اختاري الصور.');return true}catch(e){ready(false);say('❌ '+e.message);return false}}verify();['front','left','back','right'].forEach(k=>$(k).onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!/^image\/(png|jpeg)$/i.test(f.type)||f.size>20*1024*1024){e.target.value='';say('❌ PNG/JPG فقط، بحد أقصى 20MB');return}files[k]=f;const p=$(k+'P');p.src=URL.createObjectURL(f);p.style.display='block';say('✅ تم اختيار '+Object.values(files).filter(Boolean).length+' صور')});function compress(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{try{const m=1200,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))}catch(e){no(e)}};im.onerror=()=>no(Error('تعذر تجهيز الصورة'));im.src=u})}async function upload(k,i,n){say('جاري تجهيز '+i+' من '+n+' — '+k.toUpperCase()+'…');const image=await compress(files[k]);const r=await fetch('/api/tripo/naya/upload-view',{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({image,filename:'naya-'+k+'.jpg'})}),j=await json(r);if(!r.ok||!j.ok)throw Error(k.toUpperCase()+': '+detail(j,r.status));if(!j.url)throw Error(k.toUpperCase()+': لم يرجع رابط الصورة');return {url:j.url,fileType:j.fileType||'jpg'}}$('generate').onclick=async()=>{try{if(!(await verify()))return;const keys=['front','left','back','right'].filter(k=>files[k]);if(!files.front)throw Error('اختاري FRONT أولًا');if(keys.length<2)throw Error('يلزم FRONT + زاوية أخرى على الأقل');ready(false);$('bar').style.width='0%';const refs={};for(let i=0;i<keys.length;i++){refs[keys[i]]=await upload(keys[i],i+1,keys.length);$('bar').style.width=Math.round((i+1)/keys.length*55)+'%'}say('✅ الصور جاهزة. بدء Multi-View…');const r=await fetch('/api/tripo/naya/multiview',{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({refs,face_limit:12000})}),j=await json(r);if(!r.ok||!j.ok)throw Error(detail(j,r.status));taskId=j.taskId;if(!taskId)throw Error('لم يرجع رقم المهمة');$('check').disabled=false;$('bar').style.width='65%';say('✅ بدأ التوليد\nTask: '+taskId);poll()}catch(e){say('❌ فشل بدء Multi-View\n'+e.message);ready(adminReady)}};$('check').onclick=()=>check();async function check(){if(!taskId)return;try{const r=await fetch('/api/tripo/tasks/'+encodeURIComponent(taskId),{headers:headers(),cache:'no-store'}),j=await json(r);if(!r.ok||!j.ok)throw Error(detail(j,r.status));const p=Number(j.progress||0);$('bar').style.width=(65+Math.min(35,p*.35))+'%';say('الحالة: '+(j.status||'...')+'\nالتقدم: '+p+'%');if(j.modelUrl){clearInterval(timer);timer=null;$('bar').style.width='100%';$('result').style.display='block';$('viewer').src=j.modelUrl;$('glb').href=j.modelUrl;say('✅ نايا جاهزة');ready(true)}else if(['failed','cancelled','error'].includes(String(j.status||'').toLowerCase())){clearInterval(timer);timer=null;ready(true);say('❌ فشل التوليد\n'+detail(j.data||j))}}catch(e){say('❌ '+e.message)}}function poll(){clearInterval(timer);check();timer=setInterval(check,5000)}</script></body></html>
