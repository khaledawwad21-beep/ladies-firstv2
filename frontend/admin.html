<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#63345e">
<title>Ladies First — لوحة الإدارة</title>
<link rel="stylesheet" href="/admin.css">
<style>
[hidden]{display:none!important}.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px;background:#fbf4ec}.login-card{width:min(430px,100%);background:#fff;padding:24px;border-radius:22px;box-shadow:0 12px 40px #63345e22}.login-card h1{color:#63345e;margin-top:0}.field{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #e4d6df;border-radius:11px}.login-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.admin-shell{min-height:100vh}.mobile-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mobile-nav button{min-height:58px;white-space:normal}.admin-main{padding:18px;max-width:1200px;margin:auto}#sections{margin-top:14px}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand-title{font-size:24px;font-weight:800}.btn-link{text-decoration:none}@media(max-width:700px){.mobile-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-main{padding:12px}.brand-title{font-size:20px}}
</style>
</head>
<body>
<section id="login" class="login-shell" hidden>
  <div class="login-card">
    <h1>🌸 Ladies First — الإدارة</h1>
    <p>تسجيل دخول المالك / الإدارة / الموظفين</p>
    <input id="loginContact" class="field" autocomplete="username" placeholder="البريد الإلكتروني أو رقم الهاتف">
    <input id="loginPassword" class="field" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <div class="login-actions">
      <button class="btn primary" type="button" onclick="adminLogin()">تسجيل الدخول</button>
      <button class="btn" type="button" onclick="showRecovery()">نسيت كلمة المرور</button>
      <button class="btn" type="button" onclick="showOwnerSetup()">إعداد المالك</button>
    </div>
    <div id="loginMsg" style="margin-top:12px"></div>
    <div id="recoveryBox" hidden style="margin-top:14px"></div>
  </div>
</section>

<section id="app" class="admin-shell" hidden>
  <header class="top">
    <div class="nav topbar">
      <b class="brand-title">🌸 Ladies First — لوحة التحكم</b>
      <div>
        <a class="btn-link" href="/">فتح المتجر</a>
        <button type="button" onclick="logout()">تسجيل خروج</button>
      </div>
    </div>
    <div class="nav mobile-nav" style="margin-top:14px">
      <button type="button" class="nav" data-s="dashboard">🏠 الرئيسية</button>
      <button type="button" class="nav" data-s="products">📦 المنتجات</button>
      <button type="button" class="nav" data-s="inventory">📋 المخزون</button>
      <button type="button" class="nav" data-s="orders">🛍️ الطلبات</button>
      <button type="button" class="nav" data-s="users">👥 المستخدمون</button>
      <button type="button" class="nav" data-s="finance">💰 الحسابات</button>
      <button type="button" class="nav" data-s="offers">🔥 العروض</button>
      <button type="button" class="nav" data-s="catalog">🏷️ الفئات والبراندات</button>
      <button type="button" class="nav" data-s="coupons">🎟️ أكواد الخصم</button>
      <button type="button" class="nav" data-s="reports">📊 التقارير</button>
      <button type="button" class="nav" data-s="homepage">🖼️ الصفحة الرئيسية</button>
      <button type="button" class="nav" data-s="social">📱 مواقع التواصل</button>
      <button type="button" class="nav" data-s="settings">🤖 الأتمتة والنقاط</button>
      <button type="button" class="nav" data-s="staff">🛡️ الموظفون والصلاحيات</button>
      <button type="button" onclick="location.href='/naya-studio.html'">✨ نايا 3D</button>
    </div>
  </header>
  <main class="admin-main">
    <h1 id="title">الرئيسية</h1>
    <div id="sections"></div>
  </main>
</section>
<div id="toast" style="display:none"></div>
<div id="modal" hidden><div id="modalBox"></div></div>
<script src="/admin.js?v=20261004-2"></script>
<script>
(function(){
  const token=localStorage.getItem('lf_admin_token');
  if(token){ showApp(); } else { showLogin(); }
  document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin()});
})();
</script>
</body>
</html>
