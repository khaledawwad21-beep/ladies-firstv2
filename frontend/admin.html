<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladies First — لوحة التحكم</title>
<link rel="stylesheet" href="/admin.css?v=20261003-2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="login" class="login-screen" hidden>
  <div class="login-card">
    <div class="logo-mark">LF</div>
    <h1>Ladies First</h1>
    <p>دخول لوحة التحكم</p>
    <input id="loginContact" class="field" autocomplete="username" placeholder="البريد الإلكتروني أو الهاتف">
    <input id="loginPassword" class="field" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <button class="btn primary wide" onclick="adminLogin()">دخول</button>
    <div class="login-links"><button type="button" class="link-btn" onclick="showRecovery()">نسيت كلمة المرور؟</button><button type="button" class="link-btn" onclick="showOwnerSetup()">إعداد المالك لأول مرة</button></div>
    <div id="loginMsg" class="msg"></div>
    <div id="recoveryBox" class="recovery-box" hidden></div>
  </div>
</div>

<div id="app" class="shell" hidden>
  <aside>
    <div class="brand"><b>Ladies First</b><small>لوحة التحكم</small></div>
    <button class="nav active" data-s="dashboard">⌂ الرئيسية</button>
    <button class="nav" data-s="users">👥 المستخدمون</button>
    <button class="nav" data-s="products">🛍️ المنتجات</button>
    <button class="nav" data-s="inventory">📦 المخزون</button>
    <button class="nav" data-s="orders">🧾 الطلبات والفواتير</button>
    <button class="nav" data-s="finance">💰 الحسابات</button>
    <button class="nav" data-s="offers">🎯 العروض والحملات</button>
    <button class="nav" data-s="catalog">🏷️ التصنيفات والعلامات</button>
    <button class="nav" data-s="coupons">🎟️ الكوبونات</button>
    <button class="nav" data-s="reports">📊 التقارير</button>
    <button class="nav" data-s="homepage">🏠 الصفحة الرئيسية</button>
    <button class="nav" data-s="social">📱 مواقع التواصل</button>
    <button class="nav" data-s="settings">⚙️ الإعدادات</button>
    <button class="nav" data-s="staff">🛡️ الموظفون والصلاحيات</button>
    <button class="nav logout" onclick="logout()">↪ تسجيل الخروج</button>
  </aside>
  <main>
    <header>
      <div><h1 id="title">الرئيسية</h1><small>إدارة Ladies First من مكان واحد</small></div>
      <div class="header-actions">
        <button class="btn" onclick="load()">↻ تحديث</button>
        <button class="btn primary" onclick="invoicePrompt()">🖨️ طباعة فاتورة</button>
      </div>
    </header>
    <div id="toast"></div>
    <div id="sections"></div>
  </main>
</div>

<div id="modal" class="modal">
  <div class="box"><button class="close" onclick="closeModal()">×</button><h2 id="mt"></h2><div id="mb"></div></div>
</div>
<div id="print" class="print"></div>
<script src="/admin.js?v=20261003-2"></script>
</body>
</html>
