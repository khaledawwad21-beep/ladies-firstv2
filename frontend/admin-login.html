<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#63345e"><title>دخول إدارة Ladies First</title>
<style>body{font-family:Arial,Tahoma,sans-serif;background:#fbf4ec;margin:0;color:#443542}.card{max-width:420px;margin:70px auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 10px 30px #63345e18}h1{color:#63345e;text-align:center}input,button,a{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:12px;font-size:16px}input{border:1px solid #ddd}button{background:#63345e;color:#fff;border:0;font-weight:700}button:disabled{opacity:.55}a{display:block;text-align:center;color:#63345e;text-decoration:none}#msg{text-align:center;color:#a33d55;margin-top:10px;line-height:1.6}</style>
</head><body><div class="card"><h1>🌸 Ladies First</h1><input id="c" autocomplete="username" placeholder="البريد الإلكتروني أو رقم الهاتف"><input id="p" autocomplete="current-password" type="password" placeholder="كلمة المرور"><button id="b">تسجيل الدخول</button><div id="msg"></div><a href="/">العودة للمتجر</a></div>
<script>
const c=document.getElementById('c'),p=document.getElementById('p'),b=document.getElementById('b'),msg=document.getElementById('msg');
async function verify(token){const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.user)throw Error(d.message||'تعذر التحقق من الحساب');if(!['owner','admin','staff'].includes(String(d.user.role||'').toLowerCase()))throw Error('هذا الحساب ليس حساب إدارة');return d.user}
async function existing(){const token=localStorage.getItem('lf_admin_token')||'';if(!token)return;try{await verify(token);location.replace('/admin.html')}catch{localStorage.removeItem('lf_admin_token')}}
async function login(){const contact=c.value.trim(),password=p.value;if(!contact||!password){msg.textContent='أدخل البريد أو الهاتف وكلمة المرور';return}b.disabled=true;msg.textContent='جاري تسجيل الدخول…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact,password})});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||!d.token)throw Error(d.message||'بيانات الدخول غير صحيحة');await verify(d.token);localStorage.setItem('lf_admin_token',d.token);msg.style.color='#4f7652';msg.textContent='تم تسجيل الدخول بنجاح';location.replace('/admin.html')}catch(e){localStorage.removeItem('lf_admin_token');msg.style.color='#a33d55';msg.textContent=e.message||'تعذر تسجيل الدخول';b.disabled=false}}
b.addEventListener('click',login);p.addEventListener('keydown',e=>{if(e.key==='Enter')login()});existing();
</script></body></html>
