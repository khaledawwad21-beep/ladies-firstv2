<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ladies First Admin</title><style>body{font-family:Arial;background:#fbf4ec;margin:0}.card{max-width:420px;margin:70px auto;background:white;padding:24px;border-radius:20px}h1{color:#63345e;text-align:center}input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#63345e;color:white;border:0}#msg{text-align:center;color:#a33d55;margin-top:10px}</style></head><body><div class="card"><h1>🌸 Ladies First</h1><input id="c" placeholder="البريد الإلكتروني أو رقم الهاتف"><input id="p" type="password" placeholder="كلمة المرور"><button onclick="login()">تسجيل الدخول</button><div id="msg"></div></div><script>async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact:c.value.trim(),password:p.value})}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false){msg.textContent=d.message||'بيانات الدخول غير صحيحة';return}if(!d.token){msg.textContent='تعذر إنشاء جلسة الإدارة';return}localStorage.setItem('lf_admin_token',d.token);location.href='/admin.html'}</script></body></html>
