services:
  - type: web
    name: ladies-firstv2
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: DATABASE_URL
        fromDatabase:
          name: ladies-first-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-5.6-luna

      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts

      - key: OPENAI_TTS_VOICE
        value: marin

databases:
  - name: ladies-first-db
    plan: free
